<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Strict CSP. This page is handed password-recovery tokens and renders on the domain users
  are told to trust from their email, so it is worth locking down: everything is denied by
  default and the script and stylesheet live in their own files precisely so that neither
  'unsafe-inline' is needed.

  Not expressible here: frame-ancestors, which only works as an HTTP header — GitHub Pages
  does not let us set one, so this page cannot forbid being framed. Accepted: the recovery
  form is reachable only by someone already holding a valid emailed token.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src https://nrhtzksmsatoznytgjxq.supabase.co; style-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<title>ReqArch — Account</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<main>
  <h1 id="title">ReqArch</h1>
  <div id="body"><p class="msg">Loading…</p></div>
</main>
<script type="module" src="./app.js"></script>
</body>
